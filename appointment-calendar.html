<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d31">
<title>DPRO PET CARE LINE｜週間予約ボード</title>
<script src="./config.js"></script>
<style>
:root{--g:#123d31;--sage:#e8f4ee;--bg:#f4f7f5;--ink:#18312a;--muted:#6c7b75;--line:#d8e3dd;--amber:#8a6418;--amberbg:#fff7df;--red:#9c3f3f;--redbg:#fff0f0;--shadow:0 14px 38px rgba(20,55,44,.09)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#edf6f1,#fbfaf7 36%,#f3f6f4);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.55}button,input,select{font:inherit}button{cursor:pointer}.page{width:min(1560px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;background:linear-gradient(135deg,#10392d,#1c6d51);color:#fff;border-radius:28px;padding:24px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"WEEK";position:absolute;right:-8px;bottom:-46px;font-size:126px;font-weight:1000;opacity:.055}.badge{display:inline-flex;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);padding:6px 10px;border-radius:999px;font-size:11px;font-weight:950}.hero h1{font-size:clamp(30px,4vw,50px);line-height:1.08;margin:11px 0 7px;letter-spacing:-.045em}.hero p{margin:0;color:rgba(255,255,255,.87);font-weight:750}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}.nav a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);padding:8px 10px;border-radius:10px;font-size:11px;font-weight:900}.heroStats{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:center;position:relative;z-index:1}.heroStat{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.11);border-radius:16px;padding:13px}.heroStat small{display:block;opacity:.8;font-weight:850}.heroStat b{display:block;font-size:26px;margin-top:2px}.toolbar{display:grid;grid-template-columns:minmax(210px,1fr) auto auto auto auto;gap:8px;margin-top:13px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;box-shadow:0 8px 26px rgba(24,49,42,.06)}input,select{border:1px solid #ccd9d2;border-radius:11px;padding:10px 11px;background:#fff;color:var(--ink)}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:950}.main{background:var(--g);color:#fff}.soft{background:var(--sage);color:var(--g)}.notice{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:12px;font-weight:800;background:#f8fbf9;color:var(--muted)}.notice.ok{background:#eef9f2;color:#24623f;border-color:#cce7d4}.notice.ng{background:var(--redbg);color:var(--red);border-color:#efcccc}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin-top:11px}.weekHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:15px 0 9px}.weekHead h2{margin:0;font-size:22px}.weekHead span{font-size:11px;color:var(--muted);font-weight:850}.calendar{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:9px;align-items:start;overflow-x:auto;padding-bottom:8px}.day{min-width:170px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px;box-shadow:0 8px 24px rgba(24,49,42,.05)}.day.today{border-color:#8fc7ad;box-shadow:0 0 0 2px rgba(47,125,100,.12),0 8px 24px rgba(24,49,42,.05)}.dayHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:9px}.dayHead b{font-size:15px}.dayHead small{color:var(--muted);font-weight:850}.count{display:inline-flex;min-width:28px;justify-content:center;background:var(--sage);color:var(--g);padding:4px 7px;border-radius:999px;font-size:10px;font-weight:950}.list{display:grid;gap:7px}.appt{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fbfdfc}.appt.cancelled{opacity:.5;background:#fafafa}.appt.no_show{background:var(--redbg);border-color:#efcccc}.appt.checked_in{background:#f0faf5;border-color:#bfe0cf}.appt.completed{opacity:.63}.time{font-size:15px;font-weight:1000;color:var(--g)}.pet{font-size:13px;font-weight:950;margin-top:1px}.meta{font-size:10px;color:var(--muted);margin-top:2px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chip{display:inline-flex;background:#f0f4f2;color:#52615b;border-radius:999px;padding:3px 6px;font-size:9px;font-weight:900}.chip.doc{background:var(--sage);color:var(--g)}.chip.warn{background:var(--amberbg);color:var(--amber)}.empty{border:1px dashed var(--line);border-radius:11px;padding:14px;text-align:center;color:var(--muted);font-size:11px;background:#fafcfb}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px}.metric small{display:block;color:var(--muted);font-size:10px;font-weight:900}.metric b{display:block;font-size:23px;margin-top:2px}.footer{margin-top:12px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:1050px){.hero{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(7,220px)}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.heroStats{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="page">
<section class="hero"><div><span class="badge">STEP VET-APPOINTMENT-CALENDAR-1｜獣医師別・週間予約ボード</span><h1>今週の予約を、<br>先生別に見渡す。</h1><p>日時指定予約を7日間で確認。獣医師・状態で絞り込み、予約の偏りや空き状況を把握します。</p><div class="nav"><a id="todayBoard" href="./today-board.html">本日の統合ボード</a><a id="appointmentAdmin" href="./appointment-admin.html">日時指定予約管理</a><a id="doctor" href="./doctor.html">ドクター画面</a><a id="owner" href="./owner.html">オーナー画面</a></div></div><div class="heroStats"><div class="heroStat"><small>今週の予約</small><b id="heroTotal">-</b></div><div class="heroStat"><small>担当獣医師</small><b id="heroDoctors">-</b></div><div class="heroStat"><small>来院済み</small><b id="heroChecked">-</b></div><div class="heroStat"><small>取消・不在</small><b id="heroCancelled">-</b></div></div></section>
<section class="toolbar"><input id="adminCode" type="password" placeholder="管理コード"><button id="saveCode" class="btn main">保存して接続</button><button id="prevWeek" class="btn soft">← 前週</button><button id="thisWeek" class="btn soft">今週</button><button id="nextWeek" class="btn soft">次週 →</button></section>
<div id="notice" class="notice">管理コードを保存すると週間予約を読み込みます。</div>
<section class="filters"><select id="doctorFilter"><option value="">すべての獣医師</option></select><select id="statusFilter"><option value="">すべての状態</option><option value="scheduled">予約受付</option><option value="confirmed">確認済み</option><option value="checked_in">来院済み</option><option value="completed">完了</option><option value="cancelled">キャンセル</option><option value="no_show">不在</option></select><button id="refresh" class="btn main">最新情報に更新</button></section>
<section class="summary"><div class="metric"><small>予約合計</small><b id="mTotal">-</b></div><div class="metric"><small>予約受付・確認済み</small><b id="mUpcoming">-</b></div><div class="metric"><small>来院済み</small><b id="mChecked">-</b></div><div class="metric"><small>完了</small><b id="mCompleted">-</b></div></section>
<div class="weekHead"><h2 id="weekLabel">週間予約</h2><span>30秒ごとに自動更新</span></div>
<section id="calendar" class="calendar"></section>
<div class="footer"><span id="updated">最終更新：-</span><span>予約の作成・変更・来院受付は「日時指定予約管理」から行います。</span></div>
</main>
<script>
(()=>{"use strict";
const CONFIG=window.DPRO_VET_CONFIG||window.DPRO_CONFIG||window.APP_CONFIG||{};
const qs=new URLSearchParams(location.search);
const API=(CONFIG?.api?.baseUrl||CONFIG?.urls?.apiBaseUrl||"https://dpro-vet-qr-api.dpromstk2000.workers.dev").replace(/\/$/,"");
const CLINIC=qs.get("clinic_code")||CONFIG?.clinic?.clinicCode||"dpro_vet_demo";
const DEMO=CLINIC==="dpro_vet_demo"&&["ready","true","1"].includes(String(qs.get("demo")||"").toLowerCase());
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const keys=CONFIG?.admin?.tokenStorageKeys||["dpro_vet_admin_code","DPRO_VET_ADMIN_CODE"];
let weekStart=startOfWeek(new Date()),all=[];
function code(){if(typeof CONFIG.getAdminCode==="function")return CONFIG.getAdminCode()||"";for(const k of keys){const v=localStorage.getItem(k)||sessionStorage.getItem(k);if(v)return v}return""}
function saveCode(v){if(typeof CONFIG.setAdminCode==="function")CONFIG.setAdminCode(v,true);else keys.forEach(k=>localStorage.setItem(k,v))}
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function plusDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function page(file){const u=new URL(file,location.href);u.searchParams.set("clinic_code",CLINIC);if(DEMO)u.searchParams.set("demo","ready");return u.toString()}
[["todayBoard","./today-board.html"],["appointmentAdmin","./appointment-admin.html"],["doctor","./doctor.html"],["owner","./owner.html"]].forEach(([id,f])=>$(id).href=page(f));
async function get(path,q={}){const u=new URL(API+path);Object.entries({clinic_code:CLINIC,...q}).forEach(([k,v])=>{if(v!==undefined&&v!==null&&String(v)!=="")u.searchParams.set(k,String(v))});const c=code();const r=await fetch(u,{cache:"no-store",headers:{Accept:"application/json","X-DPRO-Admin-Code":c,Authorization:`Bearer ${c}`}});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.message||d.error||`API Error ${r.status}`);return d}
function statusLabel(s){return({scheduled:"予約受付",confirmed:"確認済み",checked_in:"来院済み",completed:"完了",cancelled:"キャンセル",no_show:"不在"}[s]||s||"-")}
function time(v){return String(v||"").slice(0,5)||"-"}
function doctorName(x){return x.doctor_name||x.doctor_name_snapshot||"おまかせ"}
function guardian(x){return x.guardian_name||x.guardian_name_snapshot||"飼い主"}
function pet(x){return x.pet_name||x.pet_name_snapshot||"ペット"}
function fillDoctorFilter(items){const current=$("doctorFilter").value;const names=[...new Set(items.map(doctorName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));$("doctorFilter").innerHTML='<option value="">すべての獣医師</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");if(names.includes(current))$("doctorFilter").value=current}
function filtered(){const d=$("doctorFilter").value,s=$("statusFilter").value;return all.filter(x=>(!d||doctorName(x)===d)&&(!s||String(x.status||"")===s))}
function render(){const items=filtered(),days=Array.from({length:7},(_,i)=>plusDays(weekStart,i)),today=ymd(new Date());$("weekLabel").textContent=`${ymd(days[0])} 〜 ${ymd(days[6])}`;$("calendar").innerHTML=days.map(d=>{const date=ymd(d),list=items.filter(x=>x.appointment_date===date).sort((a,b)=>time(a.start_time).localeCompare(time(b.start_time))),dayName=["日","月","火","水","木","金","土"][d.getDay()];return `<article class="day ${date===today?"today":""}"><div class="dayHead"><div><b>${d.getMonth()+1}/${d.getDate()}（${dayName}）</b><br><small>${date===today?"今日":""}</small></div><span class="count">${list.length}</span></div><div class="list">${list.length?list.map(x=>`<div class="appt ${esc(x.status||"")}"><div class="time">${esc(time(x.start_time))}</div><div class="pet">${esc(pet(x))}</div><div class="meta">${esc(guardian(x))}｜${esc(x.service_name||"日時指定予約")}</div><div class="chips"><span class="chip doc">${esc(doctorName(x))}</span><span class="chip ${["cancelled","no_show"].includes(x.status)?"warn":""}">${esc(statusLabel(x.status))}</span></div></div>`).join(""):'<div class="empty">予約なし</div>'}</div></article>`}).join("");const total=items.length,checked=items.filter(x=>x.status==="checked_in").length,cancelled=items.filter(x=>["cancelled","no_show"].includes(x.status)).length,completed=items.filter(x=>x.status==="completed").length,upcoming=items.filter(x=>["scheduled","confirmed"].includes(x.status)).length,docs=new Set(items.map(doctorName).filter(n=>n&&n!=="おまかせ"));$("heroTotal").textContent=total;$("heroDoctors").textContent=docs.size;$("heroChecked").textContent=checked;$("heroCancelled").textContent=cancelled;$("mTotal").textContent=total;$("mUpcoming").textContent=upcoming;$("mChecked").textContent=checked;$("mCompleted").textContent=completed}
async function load(){const n=$("notice");if(!code()){n.className="notice ng";n.textContent="管理コードを入力して「保存して接続」を押してください。";return}n.className="notice";n.textContent="週間予約を読み込んでいます。";try{const from=ymd(weekStart),to=ymd(plusDays(weekStart,6)),d=await get("/api/admin/exact-appointments",{from,to});all=(d.appointments||[]).filter(Boolean);fillDoctorFilter(all);render();n.className="notice ok";n.textContent=`週間予約を更新しました。${all.length}件を読み込みました。`;$("updated").textContent=`最終更新：${new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date())}`}catch(e){n.className="notice ng";n.textContent=`読み込みに失敗しました：${e.message}`}}
$("saveCode").onclick=()=>{const v=$("adminCode").value.trim();if(!v)return;saveCode(v);$("adminCode").value="••••";load()};
$("prevWeek").onclick=()=>{weekStart=plusDays(weekStart,-7);load()};
$("nextWeek").onclick=()=>{weekStart=plusDays(weekStart,7);load()};
$("thisWeek").onclick=()=>{weekStart=startOfWeek(new Date());load()};
$("refresh").onclick=load;$("doctorFilter").onchange=render;$("statusFilter").onchange=render;
if(code()){$("adminCode").value="••••";load()}else render();
setInterval(()=>{if(code())load()},30000);
})();
</script>
</body>
</html>
